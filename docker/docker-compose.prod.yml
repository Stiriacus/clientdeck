# Production compose — pulls the pre-built image from GHCR.
# No Go toolchain, no build step. Just Docker and the image.
#
# Usage:
#   cp .env.example .env
#   # Edit .env with real values
#   docker compose -f docker/docker-compose.prod.yml up -d

services:
  vitrine:
    image: ghcr.io/stiriacus/vitrine:latest
    container_name: vitrine
    ports:
      - "${VITRINE_ADDR:-8080}:8080"
    env_file:
      - ../.env
    volumes:
      - vitrine-data:/data
      # Mount your themes directory. Each subdirectory becomes a theme name
      # available for per-customer assignment. Only "plain" is embedded in the
      # binary. Set VITRINE_THEMES_DIR=/themes and VITRINE_THEME=<name> in
      # your .env file. No VITRINE_DEV needed — themes are loaded at startup.
      # - ../themes:/themes:ro
    restart: unless-stopped

volumes:
  vitrine-data:
